windowrule {
  name = brighter-focused-bar
  match:focus = 1
  # hyprbars:bar_color = rgb(1F1F28)
}

windowrule {
  name = hide-bar-on-non-floats
  match:float = 0
  # hyprbars:no_bar = true
}

windowrule = rounding 8, match:float 1

# we only want to dim for ghostty
windowrule = no_dim on, match:class negative:(*.ghostty)

# run hyprctl clients to see class names of current clients
windowrule = workspace 1, match:class (org.wezfurlong.*)
windowrule = workspace 2, match:class (vesktop)
windowrule = workspace 2, match:class (Zulip)
windowrule = workspace 2, tile on, match:class (Tracy Profiler.*)
windowrule = workspace 3, match:class (firefox)
windowrule = workspace 3, match:class (brave)
windowrule = workspace 4, match:class (thunderbird)
windowrule = workspace 5, match:class (sublime_merge)
windowrule = workspace 6, match:class (obsidian)
windowrule = workspace 7, match:class (org.inkscape.Inkscape)
windowrule = workspace 8, match:class (REAPER)
windowrule = workspace 8, match:class (com.bitwig.*)
windowrule = workspace 9, match:class (spicy)
windowrule = workspace 10, match:class (org.keepassxc.KeePassXC)

windowrule = suppress_event fullscreen, match:class ^(libreoffice.*)$
windowrule = float on, match:class (^soffice)$
windowrule = stay_focused on, match:class ^(pinentry-) # fix pinentry losing focus

# REAPER v7.36
# Don't float reaper matching regex REAPER v\d.\d
windowrule = tile on, match:title (.*REAPER v\d.\d.*)

windowrule = no_shadow on, match:float 0

# Dialog windows – float+center these windows.
windowrule = center on, float on, match:class (zenity)
windowrule = center on, float on, match:class (xdg-desktop-portal-gtk) # zenity
windowrule = center on, float on, match:title ^(Open File)(.*)$
windowrule = center on, float on, match:title ^(Select a File)(.*)$
windowrule = center on, float on, match:title ^(Choose wallpaper)(.*)$
windowrule = center on, float on, match:title ^(Open Folder)(.*)$
windowrule = center on, float on, match:title ^(Save As)(.*)$
windowrule = center on, float on, match:title ^(Library)(.*)$
windowrule = center on, float on, match:title ^(File Upload)(.*)$

$mainMod = SUPER

bind = $mainMod, return, exec, uwsm app -- ghostty
bind = $mainMod, Q, killactive, 
bind = $mainMod, M, exit, 
bind = $mainMod, V, togglefloating, 
bind = $mainMod, D, exec, uwsm app -- fuzzel --launch-prefix 'uwsm app -- ' --list-executables-in-path --terminal 'ghostty -e'
bind = $mainMod, B, exec, uwsm app -- pick-firefox-bookmark
bind = $mainMod, E, exec, uwsm app -- bemoji --type
bind = $mainMod, S, exec, uwsm app -- search-web
bind = $mainMod, P, exec, uwsm app -- pick-symbol

# Push-to-talk transcription: press to start recording, release to transcribe and type
bind = , Pause, exec, transcribe
bindr = , Pause, exec, sleep 0.2 && transcribe | wtype -

# bind = $mainMod, P, pseudo, # dwindle
# bind = $mainMod, I, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# to switch between windows in a floating workspace
bind = SUPER, Tab, cyclenext,           # change focus to another window
bind = SUPER, Tab, bringactivetotop,    # bring it to the top

# Example special workspace (scratchpad)
# bind = $mainMod, S, togglespecialworkspace, magic
# bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

binde=, XF86AudioRaiseVolume, exec, uwsm app -- wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
binde=, XF86AudioLowerVolume, exec, uwsm app -- wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-

bind = , PRINT, exec, uwsm app -- take-screenshot
bind = $mainMod , PRINT, exec, uwsm app -- record-screen
